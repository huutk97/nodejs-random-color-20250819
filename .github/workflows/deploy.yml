name: Deploy Node App via Docker Compose (SSH)

on:
  push:
    branches:
      - feature/deployDocker   # Tự động chạy khi bạn push lên nhánh feature/deployDocker

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Lấy code mới nhất từ GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ SSH vào server để deploy
      - name: Deploy to Remote Server
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: 192.168.110.73
          username: huutk
          key: 1997
          script: |
            echo "🟢 Pulling latest code..."
            cd /Users/huutk/Documents/project/nodejs-random-color-20250819
            git pull

            echo "🟡 Stopping old containers..."
            docker compose down || true

            echo "🟠 Building new Docker image (no cache)..."
            docker compose build --no-cache

            echo "🟣 Starting new containers..."
            docker compose up -d --build

            echo "🔍 Checking deployed containers..."
            docker ps

            echo "🧱 Checking images info..."
            docker images | head -n 10

            echo "✅ Deploy completed successfully!"
