name: Deploy App via Docker Compose

on:
  push:
    branches:
      - feature/deployDocker  # Chạy khi có commit lên nhánh feature/deployDocker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code từ repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Cài Docker & Docker Compose (thường sẵn có trên runner)
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Build Docker images
      - name: Build Docker images
        run: |
          docker-compose build

      # 4️⃣ Deploy containers
      - name: Run Docker Compose
        run: |
          docker-compose down
          docker-compose up -d --build
