name: Deploy Node App via Docker Compose (SSH)

on:
  push:
    branches:
      - main   # Tự động chạy khi bạn push lên nhánh main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Lấy code mới nhất từ GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ SSH vào server để deploy
      - name: Deploy to Remote Server
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: 203.205.13.153
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🟢 Pulling latest code..."
            cd /Users/huutk/Documents/project/nodejs-random-color-20250819
            git pull

            echo "🟡 Stopping old containers..."
            docker compose down || true

            echo "🟠 Building new Docker image (no cache)..."
            docker compose build --no-cache

            echo "🟣 Starting new containers..."
            docker compose up -d --build

            echo "🔍 Checking deployed containers..."
            docker ps

            echo "🧱 Checking images info..."
            docker images | head -n 10

            echo "✅ Deploy completed successfully!"
