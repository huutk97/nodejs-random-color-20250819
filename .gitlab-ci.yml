stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  COMPOSE_FILE: docker-compose.yml

before_script:
  # In case docker-compose is not yet executable
  - docker --version
  - docker-compose --version

# 1️⃣ Build stage: build Docker images
build:
  stage: build
  script:
    - echo "Building Docker images..."
    - docker-compose build
  only:
    - main  # chỉ chạy khi commit lên nhánh main (có thể đổi thành master hoặc develop)

# 2️⃣ Deploy stage: stop old containers and start new ones
deploy:
  stage: deploy
  script:
    - echo "Deploying application..."
    - docker-compose down
    - docker-compose up -d --build
  only:
    - main
